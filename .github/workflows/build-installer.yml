name: Build Windows Hub installer

# Builds THIS fork's Windows Hub installer (the WinUI "OpenClaw Companion" tray
# app packaged by Inno Setup) using the repository's own simple build commands:
#
#     dotnet publish src/OpenClaw.Tray.WinUI -c Release -r win-x64 --self-contained -o publish-x64
#     ISCC.exe /DMyAppVersion=<ver> /DMyAppArch=x64 /Dpublish=publish-x64 /DvcRedist=vc_redist.x64.exe installer.iss
#
# These are the same commands the fork's own `.github/workflows/ci.yml`
# (prepare-release-assets) runs. No OpenClaw source build is needed: the Hub
# installer ships only the tray GUI. The local gateway/agent is installed by the
# setup wizard at run time.
#
# Output artifact: OpenClawCompanion-Setup-x64.exe (a single signed-by-you .exe).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-installer:
    name: Build Hub installer (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # GitVersion needs full history and tags to compute the assembly version.
      - name: Check out Windows Hub
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $version = & ".\scripts\Get-OpenClawVersion.ps1" -Variable SemVer
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Could not resolve the application version."
          }
          "semver=$($version.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore WinUI tray app
        run: dotnet restore src/OpenClaw.Tray.WinUI -r win-x64

      - name: Publish WinUI tray app
        run: dotnet publish src/OpenClaw.Tray.WinUI -c Release -r win-x64 --self-contained --no-restore -o publish-x64 -p:Version=${{ steps.version.outputs.semver }} -p:InformationalVersion=${{ steps.version.outputs.semver }}

      - name: Download VC++ runtime redistributable
        shell: pwsh
        run: |
          $uri = "https://aka.ms/vc14/vc_redist.x64.exe"
          Invoke-WebRequest -Uri $uri -OutFile vc_redist.x64.exe
          $signature = Get-AuthenticodeSignature -LiteralPath vc_redist.x64.exe
          if ($signature.Status -ne "Valid") {
            throw "vc_redist.x64.exe Authenticode signature was $($signature.Status)."
          }
          $subject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { "" }
          if ($subject -notmatch "O=Microsoft Corporation") {
            throw "vc_redist.x64.exe signer was not Microsoft Corporation: $subject"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.version.outputs.semver }} `
            /DMyAppArch=x64 `
            /Dpublish=publish-x64 `
            /DvcRedist=vc_redist.x64.exe `
            installer.iss
          if (-not (Test-Path "Output\OpenClawCompanion-Setup-x64.exe")) {
            throw "Installer was not produced."
          }

      # Only the single installer .exe is published. Everything else (the tray
      # publish tree, NuGet cache, ISCC intermediates) stays on the runner.
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: OpenClawCompanion-Setup-x64
          path: Output/OpenClawCompanion-Setup-x64.exe
          compression-level: 0
          if-no-files-found: error
